<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EQORE · Site Evaluation</title>
  <meta name="description" content="EQORE site evaluation: public records and customer data assembled per site to judge readiness for a battery installation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
          colors: {
            ink: '#06162b', ink2: '#4a515d', mute: '#7d828b', brown: '#51453f',
            steel: '#446c87', steelsoft: '#e8eef3', blue: '#3c6390', bluesoft: '#b3c8e4',
            sand: '#efebe4', paper: '#f8f6f4', line: '#d3cecd', line2: '#e8e4e1',
            ochre: '#8f5f17', ochresoft: '#f7efe0', alert: '#ac312c', alertsoft: '#f8e9e7',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <header class="sticky top-0 z-[1100] bg-white border-b border-line">
    <div class="max-w-[1500px] mx-auto px-4 lg:px-8 h-16 flex items-center gap-5">
      <a href="#/" class="flex items-baseline gap-3 shrink-0" aria-label="EQORE site evaluation home">
        <span class="wordmark">EQORE</span><span class="hidden sm:inline eyebrow">Site Evaluation</span>
      </a>
      <nav id="crumbs" class="hidden md:flex items-center gap-2 text-[13px] text-ink2 min-w-0"></nav>
      <div class="flex-1"></div>
      <div class="relative w-full max-w-xs">
        <input id="global-search" type="search" autocomplete="off" placeholder="Address, APN or tenant" class="field w-full h-9 pl-3 pr-3 text-[13px]" />
        <div id="search-results" class="hidden absolute left-0 right-0 top-11 bg-white border border-line shadow-pop"></div>
      </div>
      <div class="relative">
        <button id="user-menu-btn" class="w-8 h-8 rounded-full bg-ink text-white grid place-items-center text-[11px] font-medium" aria-haspopup="true" aria-label="Account menu">EV</button>
        <div id="user-menu" class="hidden absolute right-0 top-11 w-56 bg-white border border-line shadow-pop py-1 text-[13px]">
          <div class="px-3 py-2 border-b border-line2"><div class="font-medium">Elena Vásquez, PE</div><div class="text-mute text-xs">Project Engineer</div></div>
          <button data-action="reset-demo" class="w-full text-left px-3 py-2 hover:bg-paper">Clear my reviews and uploads</button>
        </div>
      </div>
    </div>
  </header>

  <main id="view-list" class="max-w-[1500px] mx-auto px-4 lg:px-8 py-8"></main>
  <main id="view-site" class="hidden max-w-[1500px] mx-auto px-4 lg:px-8 py-6"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[3000] flex flex-col gap-2 items-end pointer-events-none"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/reference.js"></script>
  <script src="assets/sf_records.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
